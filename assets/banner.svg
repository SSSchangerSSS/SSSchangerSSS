<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="200" viewBox="0 0 1600 200" role="img" aria-label="Sohrab Iranpak — R&amp;D Software Engineer">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#001a00"/>
      <stop offset="50%" stop-color="#008c00"/>
      <stop offset="100%" stop-color="#00FF41"/>
    </linearGradient>
    <filter id="textShadow" x="-20%" y="-60%" width="140%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000f00" flood-opacity="0.75"/>
    </filter>
  </defs>
  <g>
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    <path d="M0,0 H1600 V140 Q1400,192 1200,150 Q1000,112 800,160 Q600,200 400,150 Q200,112 0,158 Z" fill="url(#waveGrad)"/>
    <g font-family="Consolas, 'Courier New', monospace" fill="#c8ffd6" opacity="0.28">
      <text x="90"   y="52"  font-size="15">1</text>
      <text x="230"  y="84"  font-size="13">0</text>
      <text x="360"  y="46"  font-size="14">1</text>
      <text x="510"  y="70"  font-size="12">0</text>
      <text x="660"  y="42"  font-size="15">1</text>
      <text x="950"  y="46"  font-size="13">0</text>
      <text x="1100" y="68"  font-size="14">1</text>
      <text x="1250" y="44"  font-size="15">0</text>
      <text x="1390" y="76"  font-size="12">1</text>
      <text x="1520" y="50"  font-size="14">0</text>
    </g>
    <text x="800" y="82" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="bold" fill="#FFFFFF" filter="url(#textShadow)">Sohrab Iranpak</text>
    <text x="800" y="122" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="19" fill="#EAFFEE" filter="url(#textShadow)">R&amp;D Software Engineer</text>
  </g>
</svg>
