name: Update Stats Cards

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run generator tests
        run: python .github/scripts/test_generators.py

      - name: Generate stats SVGs from live GitHub data
        env:
          GH_STATS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/gen_stats_svg.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats-light.svg assets/github-stats-dark.svg \
                  assets/top-langs-light.svg assets/top-langs-dark.svg
          if git diff --cached --quiet; then
            echo "No changes to stats cards"
          else
            git commit -m "stats: auto-update cards [skip ci]"
            git push
          fi
